name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main, "stage1/**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Enforce package dependency boundaries
        run: pnpm lint:boundaries
      - name: Enforce design-token CSS conformance
        run: pnpm check:tokens
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
